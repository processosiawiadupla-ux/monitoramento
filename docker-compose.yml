services:
  postgres:
    image: postgres:16-alpine
    container_name: wiaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiaflow
      POSTGRES_PASSWORD: wiaflow_dev
      POSTGRES_DB: wiaflow_vendas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiaflow -d wiaflow_vendas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wiaflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: